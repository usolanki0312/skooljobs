# ═══════════════════════════════════════════════
#  SkoolJobs BDD Test Configuration
# ═══════════════════════════════════════════════

# Application Base URL (update when backend is available)
app.base.url=http://localhost:5173

# Environment  (local | dev | staging | prod)
environment=local

# Test Data Paths
testdata.users=src/test/resources/testdata/users.json
testdata.jobs=src/test/resources/testdata/jobs.json
testdata.packages=src/test/resources/testdata/packages.json

# Teacher credentials
teacher.email=teacher@gmail.com
teacher.password=123456

# School / Recruiter credentials
school.email=hr@school.in
school.password=password

# Timeouts (seconds)
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# Reports
reports.output.dir=target/cucumber-reports
