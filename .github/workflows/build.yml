name: React Build Pipeline

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    environment: development

    steps:
      # Checkout Source Code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Configure Nexus Authentication
      - name: Configure Nexus npm Authentication
        run: |
          rm -f .npmrc

          cat > .npmrc <<EOF
          @schoolprofile:registry=https://repo.kaluafarms.com/repository/npm-hosted/
          //repo.kaluafarms.com/repository/npm-hosted/:username=${{ secrets.NEXUS_USERNAME }}
          //repo.kaluafarms.com/repository/npm-hosted/:_password=$(printf "%s" "${{ secrets.NEXUS_PASSWORD }}" | base64 | tr -d '\n')
          //repo.kaluafarms.com/repository/npm-hosted/:email=ci@skooljobs.com
          //repo.kaluafarms.com/repository/npm-hosted/:always-auth=true
          EOF

      # Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # Run Lint
      - name: Run Lint
        run: npm run lint

      # Run Tests
      - name: Run Tests
        run: npm test -- --watch=false
        continue-on-error: true

      # SonarQube Scan
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=react-app
            -Dsonar.sources=src
            -Dsonar.exclusions=node_modules/**,dist/**,android/**

      # Build Application
      - name: Build Application
        run: npm run build

      # Upload Build Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: dist/