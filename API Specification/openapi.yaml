openapi: 3.0.3

# ═══════════════════════════════════════════════════════════════════════════
#  SkoolJobs API — mirrors API Specification/api.md (all 5 services).
#  Protected routes need a Bearer JWT (Authorization: Bearer <token>).
# ═══════════════════════════════════════════════════════════════════════════

info:
  title: SkoolJobs API Documentation
  version: 1.0.0
  description: |
    REST API for the SkoolJobs platform. Kept in sync with api.md and Datamodel/datamodel.json.

servers:
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: Users
    description: Registration, OTP, login, password reset, and user account management.
  - name: TeacherProfiles
    description: Teacher profile, qualifications, experiences, achievements, resumes, cover letters, saved jobs.
  - name: SchoolProfiles
    description: School profile, branding/images, saved candidates.
  - name: Jobs
    description: Job posting, admin review/publish, browse, recommendations.
  - name: Applications
    description: Teacher applications, admin gate, school pipeline, interviews.

# ───────────────────────────────────────────────────────────────────────────
#  COMPONENTS
# ───────────────────────────────────────────────────────────────────────────
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ── Common wrappers ──────────────────────────────────────────────────
    SuccessResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: object }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: "Invalid request" }
        code: { type: string, example: "BAD_REQUEST" }

    PaginatedResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: array, items: { type: object } }
        total: { type: integer, example: 100 }
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }

    # ── User ─────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        user_scope:
          type: string
          enum: [sj_admin, sj_superadmin, teacher, sch_admin, sch_member]
        school_id: { type: string, format: uuid, nullable: true }
        profile_id: { type: string, format: uuid, nullable: true }
        phone: { type: string }
        is_active: { type: boolean }
        is_email_verified: { type: boolean }
        is_phone_verified: { type: boolean }
        last_login: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── Teacher embedded items ───────────────────────────────────────────
    Qualification:
      type: object
      properties:
        class_level: { type: string, nullable: true, enum: [Class 10, Class 12] }
        school_name: { type: string, nullable: true }
        degree: { type: string, example: "B.Ed" }
        course: { type: string, nullable: true }
        year_passed: { type: string, example: "2015" }
        medium: { type: string, nullable: true }
        mode: { type: string, nullable: true, enum: [Regular, Distance, Part-time, Online, Correspondence, Open University, Hybrid] }
        percentage: { type: string, nullable: true }
        university: { type: string, nullable: true }
        college: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Experience:
      type: object
      properties:
        school_name: { type: string }
        is_current_employer: { type: boolean }
        board: { type: string, nullable: true }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        main_subject: { type: string }
        other_subjects: { type: string, nullable: true }
        post_held: { type: string }
        salary_ctc_annual: { type: integer, nullable: true }
        monthly_take_home: { type: integer, nullable: true }
        reason_for_leaving: { type: string, nullable: true }
        details: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Achievement:
      type: object
      properties:
        category: { type: string, enum: [award, course] }
        type: { type: string, example: "Award" }
        name: { type: string }
        issued_by: { type: string }
        year: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Resume:
      type: object
      properties:
        resume_id: { type: string, format: uuid }
        source: { type: string, enum: [uploaded, created] }
        title: { type: string }
        file_name: { type: string }
        file_url: { type: string, nullable: true }
        format: { type: string, enum: [PDF, DOCX, Text] }
        skill: { type: string, nullable: true }
        score: { type: integer }
        full_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        mobile: { type: string, nullable: true }
        address: { type: string, nullable: true }
        current_job_title: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        skills: { type: string, nullable: true }
        education: { type: string, nullable: true }
        experience: { type: string, nullable: true }
        certifications: { type: string, nullable: true }
        languages: { type: string, nullable: true }
        resume_achievements: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CoverLetter:
      type: object
      properties:
        cover_letter_id: { type: string, format: uuid }
        title: { type: string }
        source: { type: string, enum: [ai_generated, uploaded, manual] }
        content: { type: string }
        resume_id: { type: string, format: uuid, nullable: true }
        job_id: { type: string, format: uuid, nullable: true }
        file_name: { type: string, nullable: true }
        file_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    SavedJob:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        saved_at: { type: string, format: date-time }

    # ── Teacher profile ──────────────────────────────────────────────────
    TeacherProfileBasic:
      type: object
      properties:
        teacher_profile_id: { type: string, format: uuid }
        title: { type: string, enum: [Mr, Mrs, Miss, Ms, Dr, Prof] }
        first_name: { type: string }
        middle_name: { type: string, nullable: true }
        last_name: { type: string }
        dob:
          type: object
          properties:
            day: { type: string }
            month: { type: string }
            year: { type: string }
        age: { type: integer, nullable: true }
        nationality: { type: string }
        current_job_title: { type: string, nullable: true }
        main_subject: { type: string }
        additional_subjects: { type: array, items: { type: string } }
        classes_taught: { type: array, items: { type: string } }
        languages:
          type: array
          items:
            type: object
            properties:
              language: { type: string }
              proficiency: { type: string }
        highest_qualification_1: { type: string, nullable: true }
        highest_qualification_2: { type: string, nullable: true }
        profile_photo_url: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        profile_score: { type: integer }
        is_profile_visible: { type: boolean }
        profile_verified: { type: boolean }
        contact:
          type: object
          properties:
            mobile: { type: string }
            whatsapp: { type: string, nullable: true }
            same_as_mobile: { type: boolean }
            primary_email: { type: string, format: email }
            secondary_email: { type: string, nullable: true }
        address:
          type: object
          properties:
            pin_code: { type: string, nullable: true }
            city: { type: string, nullable: true }
            state: { type: string, nullable: true }
            full_address: { type: string, nullable: true }
        notification_preferences:
          type: object
          properties:
            email: { type: boolean }
            sms: { type: boolean }
            push: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TeacherProfileFull:
      allOf:
        - $ref: '#/components/schemas/TeacherProfileBasic'
        - type: object
          properties:
            qualifications: { type: array, items: { $ref: '#/components/schemas/Qualification' } }
            experiences: { type: array, items: { $ref: '#/components/schemas/Experience' } }
            achievements: { type: array, items: { $ref: '#/components/schemas/Achievement' } }
            resumes: { type: array, items: { $ref: '#/components/schemas/Resume' } }
            cover_letters: { type: array, items: { $ref: '#/components/schemas/CoverLetter' } }
            saved_jobs: { type: array, items: { $ref: '#/components/schemas/SavedJob' } }

    # ── School profile ───────────────────────────────────────────────────
    SavedCandidate:
      type: object
      properties:
        teacher_profile_id: { type: string, format: uuid }
        saved_by_user_id: { type: string, format: uuid }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SchoolProfile:
      type: object
      properties:
        school_profile_id: { type: string, format: uuid }
        school_admin_id: { type: string, format: uuid }
        school_name: { type: string }
        sector: { type: string, enum: [Schools & Institutions, Colleges & Universities, Coaching Centers, EdTech, Government, Private, Other] }
        school_type: { type: string, enum: [Public School, Private School, International School, Boarding School, Co-Ed School, Girls School, Boys School, Special Education School, Other] }
        affiliation_status: { type: string, enum: [Affiliated, Pending Affiliation, Not Affiliated] }
        board: { type: string, enum: [CBSE, ICSE, State Board, IB, "IGCSE-Cambridge", NIOS, Other] }
        medium: { type: string }
        level: { type: string, enum: [Primary, Middle, Secondary, Senior Secondary, All Levels] }
        industry: { type: string }
        total_teachers: { type: integer, nullable: true }
        established_year: { type: integer, nullable: true }
        description: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        cover_image_url: { type: string, nullable: true }
        gallery_image_urls: { type: array, items: { type: string } }
        contact:
          type: object
          properties:
            email: { type: string }
            phone: { type: string }
            website: { type: string, nullable: true }
        address:
          type: object
          properties:
            pin_code: { type: string }
            city: { type: string }
            state: { type: string }
            country: { type: string }
            full_address: { type: string, nullable: true }
        social_links:
          type: object
          properties:
            linkedin: { type: string, nullable: true }
            facebook: { type: string, nullable: true }
            twitter: { type: string, nullable: true }
            instagram: { type: string, nullable: true }
        school_profile_status: { type: string, enum: [active, pending_verification, suspended, rejected] }
        profile_verified: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        saved_candidates: { type: array, items: { $ref: '#/components/schemas/SavedCandidate' } }

    # ── Job ──────────────────────────────────────────────────────────────
    LanguageRequirement:
      type: object
      properties:
        language: { type: string }
        proficiency: { type: string }

    Compensation:
      type: object
      properties:
        structure: { type: string, enum: [Monthly, Annual] }
        in_hand_percentage: { type: string, nullable: true }
        min_annual_ctc: { type: string, nullable: true }
        max_annual_ctc: { type: string, nullable: true }
        min_monthly_salary: { type: string, nullable: true }
        max_monthly_salary: { type: string, nullable: true }
        min_hourly_rate: { type: string, nullable: true }
        max_hourly_rate: { type: string, nullable: true }
        hours_per_week: { type: string, nullable: true }
        contract_duration: { type: string, nullable: true }
        contract_payment_type: { type: string, nullable: true }
        contract_monthly_payment: { type: string, nullable: true }
        contract_total_value: { type: string, nullable: true }
        wfh_days: { type: string, nullable: true }
        office_days: { type: string, nullable: true }
        work_timezone: { type: string, nullable: true }
        remote_location: { type: string, nullable: true }
        internship_duration: { type: string, nullable: true }
        min_stipend: { type: string, nullable: true }
        max_stipend: { type: string, nullable: true }
        monthly_benefits: { type: array, items: { type: string } }
        annual_benefits: { type: array, items: { type: string } }

    Job:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        school_profile_id: { type: string, format: uuid }
        posted_by_user_id: { type: string, format: uuid }
        title: { type: string }
        subject: { type: string }
        role_category: { type: string, nullable: true }
        employment_type: { type: string, enum: [Full-time, Part-time, Contract, Visiting, Internship, Hybrid, Remote] }
        joining_timeline: { type: string, nullable: true }
        location: { type: string }
        language_type: { type: string, nullable: true }
        language_requirements: { type: array, items: { $ref: '#/components/schemas/LanguageRequirement' } }
        min_qualification: { type: string, nullable: true }
        additional_qualification: { type: string, nullable: true }
        certifications: { type: array, items: { type: string } }
        experience_required: { type: string, nullable: true }
        qualifications_required: { type: string, nullable: true }
        student_levels: { type: array, items: { type: string } }
        preferred_school_types: { type: array, items: { type: string } }
        description: { type: string, nullable: true }
        requirements: { type: string, nullable: true }
        required_skills: { type: array, items: { type: string } }
        technical_skills: { type: array, items: { type: string } }
        compensation: { $ref: '#/components/schemas/Compensation' }
        vacancies: { type: integer }
        gender_preference: { type: string, enum: [Any, Male, Female] }
        interview_mode: { type: string, nullable: true }
        publish_option: { type: string, enum: [Publish Immediately, Publish Later] }
        publish_at: { type: string, format: date-time, nullable: true }
        admin_review_status: { type: string, enum: [pending_review, published, rejected, unpublished] }
        status: { type: string, enum: [draft, scheduled, active, closed, expired] }
        admin_rejection_reason: { type: string, nullable: true }
        applicants_count: { type: integer }
        posted_date: { type: string, format: date-time, nullable: true }
        expiry_date: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── Application ──────────────────────────────────────────────────────
    AdminReview:
      type: object
      properties:
        action: { type: string, nullable: true, enum: [approve, reject] }
        admin_user_id: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }
        actioned_at: { type: string, format: date-time, nullable: true }

    Interview:
      type: object
      properties:
        interview_id: { type: string, format: uuid }
        round: { type: string, enum: [1st Round, 2nd Round, Technical Round, HR Round, Final Round] }
        scheduled_date: { type: string, format: date }
        scheduled_time: { type: string }
        duration: { type: string, enum: [15 Minutes, 30 Minutes, 45 Minutes, 60 Minutes, 90 Minutes] }
        mode: { type: string, enum: [Online, In-Person, Telephonic] }
        online_platform: { type: string, nullable: true, enum: [Google Meet, Zoom, Microsoft Teams, WhatsApp Video Call] }
        meeting_link: { type: string, nullable: true }
        location: { type: string, nullable: true }
        room: { type: string, nullable: true }
        interviewer: { type: string, nullable: true }
        notes_for_candidate: { type: string, nullable: true }
        internal_notes: { type: string, nullable: true }
        reminders:
          type: object
          properties:
            confirmation: { type: boolean }
            remind_24h: { type: boolean }
            remind_1h: { type: boolean }
        status: { type: string, enum: [Scheduled, Confirmed, Completed, Cancelled] }
        scheduled_by_user_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Application:
      type: object
      properties:
        application_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        teacher_user_id: { type: string, format: uuid }
        school_id: { type: string, format: uuid }
        resume_id: { type: string, format: uuid, nullable: true }
        cover_letter_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [submitted, admin_approved, admin_rejected, shortlisted, rejected_by_school, hired, withdrawn] }
        school_notes: { type: string, nullable: true }
        admin_review: { $ref: '#/components/schemas/AdminReview' }
        applied_date: { type: string, format: date }
        reviewed_at: { type: string, format: date-time, nullable: true }
        submitted_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        interviews: { type: array, items: { $ref: '#/components/schemas/Interview' } }

# ───────────────────────────────────────────────────────────────────────────
#  PATHS
# ───────────────────────────────────────────────────────────────────────────
paths:

  # ═══ Users ═════════════════════════════════════════════════════════════

  /api/auth/registerUser:
    post:
      tags: [Users]
      operationId: registerUser
      summary: Step 1 — submit signup details, OTP is triggered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, email, phone, user_scope]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                user_scope: { type: string, enum: [teacher] }
      responses:
        '201':
          description: Created, OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      user_id: { type: string, format: uuid }
                      message: { type: string }
        '409':
          description: Email already registered
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/auth/requestOtp:
    post:
      tags: [Users]
      operationId: requestOtp
      summary: Send / resend an OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, purpose]
              properties:
                identifier: { type: string }
                purpose: { type: string, enum: [registration, phone_verification, email_verification, password_reset] }
      responses:
        '200':
          description: OTP sent
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }
        '429':
          description: Too many requests
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/auth/verifyOtp:
    post:
      tags: [Users]
      operationId: verifyOtp
      summary: Step 2 — verify the OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, otp, purpose]
              properties:
                identifier: { type: string }
                otp: { type: string }
                purpose: { type: string, enum: [registration, phone_verification, email_verification, password_reset] }
      responses:
        '200':
          description: Verified
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }
        '400':
          description: Invalid or expired OTP
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/auth/completeRegistration:
    post:
      tags: [Users]
      operationId: completeRegistration
      summary: Step 3 — set password, account created, JWT returned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, password, confirm_password, agree_terms]
              properties:
                user_id: { type: string, format: uuid }
                password: { type: string, format: password }
                confirm_password: { type: string, format: password }
                agree_terms: { type: boolean }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      user: { $ref: '#/components/schemas/User' }
        '422':
          description: Passwords mismatch or terms not agreed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/auth/login:
    post:
      tags: [Users]
      operationId: login
      summary: Login (any user_scope)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      user: { $ref: '#/components/schemas/User' }
        '401':
          description: Invalid credentials
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/auth/logout:
    post:
      tags: [Users]
      operationId: logout
      summary: Logout current session
      security: [ { BearerAuth: [] } ]
      responses:
        '200':
          description: Logged out
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }

  /api/auth/setPassword:
    patch:
      tags: [Users]
      operationId: setPassword
      summary: Set a new password (logged-in change OR forgot/reset via OTP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [current_password, new_password, confirm_password]
                  properties:
                    current_password: { type: string, format: password }
                    new_password: { type: string, format: password }
                    confirm_password: { type: string, format: password }
                - type: object
                  required: [identifier, otp, new_password, confirm_password]
                  properties:
                    identifier: { type: string }
                    otp: { type: string }
                    new_password: { type: string, format: password }
                    confirm_password: { type: string, format: password }
      responses:
        '200':
          description: Password updated
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }
        '400':
          description: Bad current password / OTP / mismatch
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/users/getLoggedinUser:
    get:
      tags: [Users]
      operationId: getLoggedinUser
      summary: Get the logged-in user's account
      security: [ { BearerAuth: [] } ]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/User' }
        '401':
          description: Unauthorized
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  # ═══ TeacherProfiles ═══════════════════════════════════════════════════

  /api/teacherProfiles/saveTeacherProfile:
    post:
      tags: [TeacherProfiles]
      operationId: saveTeacherProfile
      summary: Create/update (upsert) the logged-in teacher's profile + embedded arrays
      security: [ { BearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
